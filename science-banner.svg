      <path id="repeat-bracket-right" d="M 325.2 292 C 352 334 352 383 325.2 425"/>
    </g>
    <g id="nitrogen-electron-pair" fill="#11161c">
      <circle id="electron-left" cx="121.7" cy="319" r="5"/>
      <circle id="electron-right" cx="144.2" cy="319" r="5"/>
