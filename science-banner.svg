<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="1584" height="396" viewBox="0 60 2048 512"
     stroke-width="5.2" role="img" aria-labelledby="title description">
  <title id="title">Polymer and Bayesian optimization — website green</title>
  <desc id="description">Editable vector artwork. Monomer centers are equally spaced by arc length. The illustrative surrogate interpolates sampled values without incorporating unsampled interior features of the independent dashed objective. Polymer and surrogate share continuous tangent and curvature at their join. All monomer and observation markers have radius 19 and no outline. Every stroked path inherits the same 5.2-unit line weight. The taller dashed objective spans the entire uncertainty domain. One symmetric illustrative uncertainty band follows the selected reference geometry with its width increased by 15 percent. Website accent: #477777.</desc>
  <defs>
    <linearGradient id="charcoal" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#11161c"/><stop offset="1" stop-color="#293237"/>
    </linearGradient>
    <linearGradient id="light-green" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#a9c0bc"/><stop offset="1" stop-color="#8eadaa"/>
    </linearGradient>
    <linearGradient id="website-green" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#477777"/><stop offset="1" stop-color="#315f60"/>
    </linearGradient>
  </defs>

